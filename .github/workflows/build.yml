name: Build JARVIS 6.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # 1. SOURCE CODE
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ====================================================
      # 2. PYTHON
      # ====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ====================================================
      # 3. JAVA
      # ====================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ====================================================
      # 4. SYSTEM PACKAGES
      # ====================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      # ====================================================
      # 5. PYTHON PACKAGES
      # ====================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install cython==0.29.37


      # ====================================================
      # 6. CHECK PROJECT
      # ====================================================

      - name: Check JARVIS files
        run: |
          echo "===== PROJECT FILES ====="

          find . -maxdepth 2 -type f | sort

          echo ""
          echo "===== MAIN FILE ====="

          test -f main.py

          echo "main.py OK"

          echo ""
          echo "===== JARVIS CORE ====="

          test -f jarvis.py

          echo "jarvis.py OK"

          echo ""
          echo "===== LANGUAGE BRAIN ====="

          test -f language_brain.py

          echo "language_brain.py OK"

          echo ""
          echo "===== BRAIN MODEL ====="

          test -f jarvis_brain.json

          echo "jarvis_brain.json OK"


      # ====================================================
      # 7. BUILD
      # ====================================================

      - name: Build JARVIS APK
        run: |
          buildozer android debug


      # ====================================================
      # 8. FIND APK
      # ====================================================

      - name: Find APK
        run: |
          echo "================================"
          echo "APK FILES"
          echo "================================"

          find bin \
            -type f \
            -name "*.apk" \
            -print


      # ====================================================
      # 9. UPLOAD APK
      # ====================================================

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-6.0-APK
          path: bin/*.apk
          if-no-files-found: error