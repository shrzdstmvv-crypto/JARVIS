name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv

      - name: Cache Buildozer data
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Make sure the app icon exists
        run: |
          if [ ! -f jarvis_icon.png ]; then
            pip install pillow
            python create_icon.py || true
          fi
          if [ ! -f jarvis_icon.png ]; then
            python - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new("RGB", (512, 512), (15, 23, 42))
          d = ImageDraw.Draw(im)
          d.ellipse((96, 96, 416, 416), outline=(56, 189, 248), width=24)
          d.ellipse((196, 196, 316, 316), fill=(56, 189, 248))
          im.save("jarvis_icon.png")
          PY
          fi
          ls -l jarvis_icon.png

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
