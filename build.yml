name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv

      - name: Cache Buildozer data
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          if [ -f jarvis_debug.keystore ]; then
            cp jarvis_debug.keystore ~/.android/debug.keystore
            echo "Fixed signing key is in use."
          else
            echo "WARNING: jarvis_debug.keystore not found, a new random key will be used."
          fi

      - name: Build debug APK
        run: |
          java -version
          buildozer -v android debug

      - name: Show APK signing certificate
        run: |
          keytool -printcert -jarfile bin/*.apk | grep -E "SHA256|Owner" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
